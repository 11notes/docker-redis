image:
  repository: 11notes/redis
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 1
nameOverride: ""
fullnameOverride: ""
timezone: "Europe/Zurich"

redis:
  ip: "0.0.0.0"
  port: 6379
  secret: ""

extraEnv: []

service:
  type: ClusterIP
  ports:
    redis: 6379
  annotations: {}

containerSecurityContext:
  runAsUser: 1000
  runAsGroup: 1000
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true

persistence:
  redis:
    enabled: true
    existingClaim: ""
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 16Gi

readinessProbe:
  exec:
    command:
      - /usr/local/bin/redis-cli
      - ping
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

livenessProbe:
  exec:
    command:
      - /usr/local/bin/redis-cli
      - ping
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podLabels: {}